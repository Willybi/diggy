name: Deploy to VPS

on:
  push:
    branches:
      - master

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: server/frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd server/frontend && npm ci

      - name: Lint frontend
        run: cd server/frontend && npm run lint

      - name: Check formatting (Prettier)
        run: cd server/frontend && npm run format:check

  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - run: pip install ruff && ruff check server/

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector-capable image (the `vector` extension must exist because the
        # test schema is built via create_all, which emits vector(1280) for the
        # track_embeddings.embedding column — C9.a). Matches the prod ./postgres
        # image that also ships pgvector.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: diggy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-test.txt

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/diggy_test
        # -n auto: parallelize across the runner's cores (2 on GitHub-hosted).
        # Each xdist worker gets its OWN PostgreSQL database (see
        # tests/api/conftest.py) so the per-test TRUNCATE ... CASCADE stays
        # isolated. --dist loadscope keeps a module's tests on one worker.
        # pytest-cov combines the per-worker coverage before the gate.
        run: pytest tests/ -q -n auto --dist loadscope --cov=server --cov-report= --cov-fail-under=55

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Audit Python dependencies
        # Blocking gate (see `audit` in the deploy job's `needs:`). Only advisories
        # with NO actionable fix are ignored here — anything with a fix version must
        # be resolved by upgrading the dependency, never suppressed:
        #   - PYSEC-2025-185 (python-jose): the sole no-fix advisory on python-jose;
        #     exposure is mitigated (we sign JWTs with HS256 symmetric keys, no JWE).
        #   - PYSEC-2026-1325 (ecdsa, transitive via python-jose): Minerva P-256
        #     timing side-channel on signing; upstream declared WON'T-FIX (side
        #     channels are out of scope) and we never ECDSA-sign (HS256 only).
        run: pip install pip-audit && pip-audit -r server/api/requirements.txt --desc --ignore-vuln PYSEC-2025-185 --ignore-vuln PYSEC-2026-1325

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: server/frontend/package-lock.json
      - name: Install dependencies
        run: cd server/frontend && npm ci
      - name: Run tests
        run: cd server/frontend && npx vitest run

  deploy:
    runs-on: ubuntu-latest
    needs: [lint-frontend, lint-python, test, audit, test-frontend]
    steps:
      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key -o ConnectTimeout=30 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 "$VPS_USER@$VPS_HOST" '
            cd /root/diggy &&
            git fetch origin &&
            git reset --hard origin/master &&
            docker compose build &&
            docker compose up -d --no-deps postgres &&
            docker compose run --rm -T api python -m alembic upgrade head &&
            docker compose up -d &&
            (docker compose exec -T nginx nginx -s reload 2>/dev/null || true)
          '

      - name: Health check
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key -o ConnectTimeout=30 "$VPS_USER@$VPS_HOST" '
            sleep 15
            curl -sfLk https://localhost/api/health || exit 1
          '

      - name: Smoke test endpoints
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key -o ConnectTimeout=30 "$VPS_USER@$VPS_HOST" '
            FAIL=0
            for endpoint in /api/catalog/?limit=1 /api/artists/?limit=1 /api/sets/?limit=1 /api/genres; do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" -Lk "https://localhost${endpoint}")
              if [ "$STATUS" != "200" ]; then
                echo "FAIL: ${endpoint} returned ${STATUS}"
                FAIL=1
              else
                echo "OK: ${endpoint}"
              fi
            done
            exit $FAIL
          '
