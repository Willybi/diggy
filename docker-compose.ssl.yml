services:
  nginx:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./server/nginx/default.ssl.conf.template:/etc/nginx/templates/ssl.conf.template:ro
      - ./server/nginx/empty.conf:/etc/nginx/conf.d/default.conf
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    environment:
      DOMAIN: ${DOMAIN}
    # Reload nginx when certbot signals a renewal via flag file
    entrypoint:
      - /bin/sh
      - -c
      - |
        /docker-entrypoint.sh nginx -g "daemon off;" &
        while :; do
          sleep 60
          if [ -f /etc/letsencrypt/.reload ]; then
            nginx -s reload 2>/dev/null && rm -f /etc/letsencrypt/.reload
          fi
        done

  certbot:
    image: certbot/certbot:v5.7.0
    container_name: diggy_certbot
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --deploy-hook \"touch /etc/letsencrypt/.reload\"; sleep 12h & wait $${!}; done'"
    networks:
      - diggy_network

  # Restart any container that goes UNHEALTHY. Plain Compose's `restart:
  # unless-stopped` only reacts to PID-1 exit, NOT to an unhealthy healthcheck —
  # so a wedged worker (master alive, consumer stuck) sits dead until a manual
  # restart, which is exactly the 2026-08-10→14 metric_snapshots gap. autoheal
  # watches containers labelled `autoheal=true` (worker/worker_enrich/beat) and
  # restarts them when their healthcheck reports unhealthy. Prod-only: it needs
  # the host Docker socket (VPS path), so it lives in the ssl overlay, not base.
  autoheal:
    image: willfarrell/autoheal:1.2.0
    container_name: diggy_autoheal
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 30 # seconds between health sweeps
      AUTOHEAL_START_PERIOD: 120 # grace before the first check
      AUTOHEAL_DEFAULT_STOP_TIMEOUT: 30 # SIGTERM grace before SIGKILL on restart
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  certbot_conf:
  certbot_www:
