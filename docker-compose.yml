services:
  postgres:
    # postgres:16-alpine + pgvector built from source (C9.a). Stable image tag so
    # `docker compose up -d` reuses the built image instead of rebuilding.
    build: ./postgres
    image: diggy-postgres:16-pgvector
    container_name: diggy_postgres
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
    # Docker's default /dev/shm is 64 MB — saturated by the parallel HashAgg of
    # GET /api/artists/ (unnest(genres) + group by), which failed to resize a
    # shared memory segment ("No space left on device" → DiskFull). 256 MB gives
    # the margin (memory cap stays 1G — /dev/shm draws on host RAM, not the cap).
    shm_size: 256mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - diggy_network
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      # 60s (was 10s): each healthcheck is a docker exec that loads dockerd; 3
      # services polling every 10s inflated the dockerd CPU line (Hostinger
      # fair-use throttle, 2026-08-19). 1/min is ample for these stable services.
      interval: 60s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: diggy_redis
    restart: unless-stopped
    # Persist /data on a named volume + enable AOF. Redis holds durable state
    # beyond the Celery broker: the TrackID backfill cursor (trackid_backfill_*),
    # rate-limit windows and the reco cache. Without a volume, /data lives on the
    # container's ephemeral layer, so any `docker compose up -d` that recreates
    # redis (a deploy) wipes the RDB dump — which reset the backfill cursor from
    # ~4 months of history back to today on 2026-08-20. AOF (fsync every second)
    # keeps loss to <1s of writes; RDB save points are kept as a fallback.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --save
      - "3600 1 300 100 60 10000"
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    networks:
      - diggy_network
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 60s
      retries: 5

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: diggy_api
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 3G
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - diggy_network
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --workers 2
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3

  worker:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: diggy_worker
    restart: unless-stopped
    # Restarted by the autoheal sidecar (prod overlay) when its healthcheck goes
    # unhealthy — plain Compose's restart policy only reacts to PID-1 exit, not
    # to an unhealthy container (cf. the 2026-08-10→14 metric_snapshots gap).
    labels:
      autoheal: 'true'
    deploy:
      resources:
        limits:
          cpus: '2'
          # 2G (not 1G): the nightly precompute_recommendations task peaks a
          # single reco compute at ~433 MB over the ~615 MB worker baseline
          # (~1.05 GB total) — over a 1G cap it would OOM-kill the worker
          # mid-run. Host has ~11 GB free (mesuré 2026-08-13).
          memory: 2G
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - diggy_network
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    # --max-memory-per-child: gracefully recycle a pool child once its RSS
    # exceeds ~1.46 GiB (KiB), BEFORE it can reach the 2G cgroup cap and be
    # OOM-killed silently (master survives → container never exits → no restart).
    # Recycle happens between tasks, so it never interrupts a single running task.
    command: celery -A workers.celery_app worker --loglevel=warning -Q celery,crawl -c 3 --max-memory-per-child=1500000
    healthcheck:
      test: ["CMD-SHELL", "celery -A workers.celery_app inspect ping -d celery@$$HOSTNAME"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 60s

  worker_enrich:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: diggy_worker_enrich
    restart: unless-stopped
    labels:
      autoheal: 'true'
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - diggy_network
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    # 2G cap (raised from 1G): with -c 2, two children each at the ~781 MiB
    # (KiB) recycle threshold weigh ~1.56 GiB — that does NOT fit under a 1G cap,
    # so the worker was OOM-killed (signal 9). 2G leaves the margin, and
    # --max-memory-per-child recycles a leaking child BETWEEN tasks (so it never
    # interrupts a running task) BEFORE it can reach the cgroup cap and be
    # OOM-killed silently (master survives → container never exits → no restart).
    command: celery -A workers.celery_app worker --loglevel=warning -Q enrich -c 2 --max-memory-per-child=800000
    healthcheck:
      test: ["CMD-SHELL", "celery -A workers.celery_app inspect ping -d celery@$$HOSTNAME"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 60s

  beat:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: diggy_beat
    restart: unless-stopped
    labels:
      autoheal: 'true'
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - diggy_network
    volumes:
      - beat_schedule:/var/spool/celery
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    command: celery -A workers.celery_app beat --loglevel=warning -s /var/spool/celery/beat-schedule
    healthcheck:
      # PersistentScheduler rewrites the schedule file every ~3 min; stale mtime = beat is stuck
      test: ["CMD-SHELL", "find /var/spool/celery -name 'beat-schedule*' -mmin -15 | grep -q ."]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: ./server/frontend
      target: production
    container_name: diggy_frontend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
    networks:
      - diggy_network
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: diggy_minio
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          # Raised 2G->3G (2026-08-09): at the prior 2G cap (itself raised from
          # 1G on 2026-07-22) the working-set stayed pinned at ~99.5% of the cap
          # within ~5 days (Go RSS + object-metadata cache); host has ample free
          # RAM (~11G), so the tight cap was artificial. Takes effect on the next
          # deploy (up -d recreates the container; a plain restart does NOT
          # re-read the limit). A weekly `restart minio` cron (Mon 00:30
          # Europe/Paris) trims RSS as extra hygiene.
          memory: 3G
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
      # Soft heap ceiling BELOW the 3G cgroup limit above: Go's GC targets this
      # and runs harder as RSS approaches it, so an OOM-kill (hard cgroup limit)
      # becomes cheap GC pressure instead. MinIO RSS creeps up over ~a day (heap
      # not returned to the OS + the data-usage scanner walking ~190k objects)
      # and settles near this ceiling rather than falling back — the weekly
      # restart, not GOMEMLIMIT, is what actually trims it back down. 2700MiB
      # leaves ~300MiB for off-heap/goroutines under the 3G cap.
      GOMEMLIMIT: 2700MiB
    volumes:
      - minio_data:/data
    networks:
      - diggy_network
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 60s
      retries: 5

  nginx:
    image: nginx:1.29-alpine
    container_name: diggy_nginx
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    volumes:
      - ./server/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - frontend
      - minio
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - diggy_network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider --no-check-certificate https://127.0.0.1:443/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  backup:
    image: alpine:3.20
    container_name: diggy_backup
    profiles: ["backup"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - diggy_network
    volumes:
      - ./server/scripts/backup.sh:/backup.sh:ro
      - ./server/scripts/backup_freshness_check.sh:/freshness.sh:ro
      - backups:/backups
      # Read-write on purpose: rclone rewrites its OAuth token on every refresh (a :ro
      # mount would break it). Host dir only exists on the VPS (profile "backup" never runs locally).
      - /root/.config/rclone:/root/.config/rclone
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
    entrypoint: /bin/sh
    command:
      - -c
      - |
        apk add --no-cache postgresql16-client curl gnupg rclone > /dev/null 2>&1
        curl -sSL https://dl.min.io/client/mc/release/linux-amd64/mc -o /usr/local/bin/mc
        chmod +x /usr/local/bin/mc
        cp /backup.sh /tmp/backup.sh && chmod +x /tmp/backup.sh
        /tmp/backup.sh

volumes:
  postgres_data:
  minio_data:
  redis_data:
  backups:
  beat_schedule:

networks:
  diggy_network:
    name: diggy_network
